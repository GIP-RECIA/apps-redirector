name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint source files
        run: |
          php -l index.php
          php -l resolution.php

      - name: Install synthetic CI configuration
        run: cp ci/conf/conf.inc.php conf/conf.inc.php

      - name: Lint CI configuration
        run: php -l conf/conf.inc.php

      - name: Run resolution unit tests
        run: php tests/resolution.php
