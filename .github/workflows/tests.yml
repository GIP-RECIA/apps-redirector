name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint source files
        run: |
          php -l index.php
          php -l resolution.php

      - name: Install synthetic CI configuration
        run: cp ci/conf/conf.inc.php conf/conf.inc.php

      - name: Lint CI configuration
        run: php -l conf/conf.inc.php

      - name: Run resolution unit tests
        run: php tests/resolution.php
